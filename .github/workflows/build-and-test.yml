name: Build and Test

# Every PR, and every deployment (Deploy Master, Deploy Branch to Staging), which calls it to test the commit again and
# package the app it then deploys.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit or branch to build, test and package.
        type: string
        required: true
    outputs:
      version:
        description: The commit's first 7 characters, which /healthz reports once it's deployed.
        value: ${{ jobs.build-and-test.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push to a PR replaces its run in progress; a deployment's tests are never cancelled by another's.
    concurrency:
      group: build-and-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    # The repository tests run against the Cosmos DB emulator. It has a well-known key and holds nothing but the
    # tests' throwaway databases. HTTPS, because the .NET SDK doesn't talk HTTP to it.
    services:
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
          - 8080:8080
        env:
          PROTOCOL: https

    steps:
      # A PR's own commit, or the one a deployment asks for.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Version
        id: version
        run: echo "version=$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore DailyMachineSpirit.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build DailyMachineSpirit.slnx -c Release --no-restore

      # The Azure CLI on the runner compiles and lints the infrastructure; deploying it is a separate step (infra/README.md).
      - name: Bicep builds without warnings
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep --diagnostics-format sarif > bicep-lint.sarif
          az bicep build --file infra/main.bicep --stdout > /dev/null
          if jq -e '[.runs[].results[]] | length > 0' bicep-lint.sarif > /dev/null; then
            jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri)::\(.message.text)"' bicep-lint.sarif
            exit 1
          fi

      - name: Wait for the Cosmos DB emulator
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/ready >/dev/null && exit 0
            sleep 2
          done
          echo "::error title=Cosmos DB emulator::Not ready after 2 minutes."; exit 1

      # Same script as local runs; the coverage minimum lives there.
      - name: Test, coverage report, and coverage gate
        shell: pwsh
        run: ./tools/coverage.ps1 -NoBuild

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/SummaryGithub.md') != '' }}
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coverage/
          retention-days: 14

      # A deployment deploys exactly what was tested here: built once, with the commit it reports (AppVersion), the
      # version it should report, and the smoke tests from the same commit. Kept 90 days, as the package a later
      # deployment rolls back to.
      - name: Package the app
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet publish src/DailyMachineSpirit.Functions -c Release --no-build -o package/publish
          echo "${{ steps.version.outputs.version }}" > package/version.txt
          dotnet publish tests/DailyMachineSpirit.SmokeTests -c Release --no-build -o package/smoke-tests

      - name: Upload the package
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: package/
          # The Functions worker needs publish/.azurefunctions.
          include-hidden-files: true
          retention-days: 90
