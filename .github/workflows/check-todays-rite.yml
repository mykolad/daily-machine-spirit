name: Check Today's Rite

# Every day, after the DailyRite timer and its retries (three, 20 minutes apart) have had their time, Today must show
# today's rite. It looks at the page readers get, through Cloudflare, so it also catches a rite that was published but
# not shown (a failed purge keeps the old page for up to an hour, which 02:00 leaves room for). A missing rite opens an
# issue (once per day), which emails the owner.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look for today's rite on Today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          # A page that doesn't answer at all hides the rite from readers too, so it's reported the same way.
          page=$(curl -sSf -m 30 --retry 3 --retry-all-errors https://dailymachinespirit.fyi/ 2> fetch-error.txt) || page=''
          # The rite card's own date: the button its day as we reckon it describes (rite-day) holds the <time>. A test
          # holds this to Today's page (SitePagesTests), as it does the synthetic check's.
          marker='aria-describedby="rite-day"><time datetime="'
          if grep -qF "$marker$today\"" <<< "$page"; then
            echo "Today shows the rite for $today." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="No rite on $today"
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "Already reported in an open issue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$page" ]; then
            shown="no page at all ($(tr -d '\n' < fetch-error.txt))"
          else
            shown=$(grep -o "$marker[0-9-]*" <<< "$page" | grep -o '[0-9]\{4\}-[0-9-]*' || echo 'no rite')
          fi
          {
            echo "At 02:00 UTC, Today (https://dailymachinespirit.fyi/) shows $shown, not the rite for $today."
            echo
            echo "- If the rite wasn't published: the DailyRite function's error logs in Grafana (Loki, service machinespirit-app) say why. Once fixed, run DailyRite again (the Azure portal: the function app → DailyRite → Test/Run); it publishes today's rite, since the day has none."
            echo "- If it was published but Today doesn't show it: Cloudflare kept the old page. Purge \`/\` in Cloudflare (Caching → Configuration → Custom Purge), and look for a failed purge (\`dms_pages_purges_total\`)."
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          echo "::warning::No rite on $today; an issue was opened."
