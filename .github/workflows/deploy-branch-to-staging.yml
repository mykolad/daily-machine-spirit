name: Deploy Branch to Staging

# Tries a PR's branch on staging before it's merged (Actions → Deploy Branch to Staging → Run workflow): tested,
# deployed and smoke-tested like master, and replaced by the last good master if the smoke tests fail. Staging keeps
# it until the next deployment; the next merge to master puts master back.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        type: string
        required: true
        default: master

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build-and-test:
    name: build-and-test
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ inputs.branch }}

  staging:
    name: staging
    needs: build-and-test
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app-name: machinespirit-app-staging
      base-url: https://machinespirit-app-staging.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      admits-only-owner: true
