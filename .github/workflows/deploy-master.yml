name: Deploy Master

# Every merge to master is built and tested again (a flaky pass on its PR doesn't reach staging), packaged once, and
# that package is deployed to staging, smoke-tested, and rolled back if the smoke tests fail. Production joins at
# launch, after staging.
on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build-and-test:
    name: build-and-test
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ github.sha }}

  staging:
    name: staging
    needs: build-and-test
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app-name: machinespirit-app-staging
      base-url: https://machinespirit-app-staging.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      admits-only-owner: true
