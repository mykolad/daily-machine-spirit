name: Deploy Master

# Every merge to master is built and tested again (a flaky pass on its PR doesn't reach staging), packaged once, and
# that package is deployed to staging, smoke-tested, and rolled back if the smoke tests fail (each environment's deploy
# and rollback are jobs of their own: staging / deploy, staging / rollback). Only when staging passed does the same
# package go to production, smoke-tested and rolled back the same way: no approval, staging is the gate. Production's
# standby in UK South (#113) follows the first app the same way.
on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write
  actions: read

# One merge at a time, from build to smoke tests, so an older commit's build finishing late can't deploy over a newer
# one. A run in progress is never cancelled; of the merges waiting behind it, only the newest runs (it includes the
# others).
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build-and-test:
    name: build-and-test
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ github.sha }}

  staging:
    name: staging
    needs: build-and-test
    # One deployment per environment at a time, in the order they arrive. A newer one waits rather than cancelling one
    # half done, and the queue keeps every waiting deployment: by default GitHub keeps only the newest, so a branch
    # deployment could knock out a merge's.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app-name: machinespirit-app-staging
      base-url: https://machinespirit-app-staging.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      test-voter-vault: machinespirit-kv-staging

  # Only when staging's smoke tests themselves failed. A job beside the deploy, not after it, so the run's graph shows a
  # staging rollback as where the run ends: production follows the deploy alone, and only when it passed.
  rollback-staging:
    name: roll back staging
    needs: [build-and-test, staging]
    if: ${{ failure() && needs.staging.outputs.smoke == 'failure' }}
    # Staging's lock again. Between the two jobs it's free for a moment, so a Deploy Branch to Staging started just then
    # could come first, and this would put master back over it; Deploy Master runs never overlap (concurrency above).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rollback.yml
    with:
      environment: staging
      app-name: machinespirit-app-staging
      base-url: https://machinespirit-app-staging.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      test-voter-vault: machinespirit-kv-staging

  # The same package, once staging ran it and passed its smoke tests (a failed staging deploy, rolled back or not,
  # stops here). Smoke-tested on the app's own address, past Cloudflare's cache, so they test what was just deployed.
  production:
    name: production
    needs: [build-and-test, staging]
    # As staging's.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app-name: machinespirit-app
      base-url: https://machinespirit-app.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true

  rollback-production:
    name: roll back production
    needs: [build-and-test, production]
    if: ${{ failure() && needs.production.outputs.smoke == 'failure' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rollback.yml
    with:
      environment: production
      app-name: machinespirit-app
      base-url: https://machinespirit-app.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true

  # Production's standby in UK South (#113), which Traffic Manager sends readers to while the first app doesn't
  # answer: the same package, once the first app passed with it, smoke-tested on its own address.
  production-standby:
    name: production standby
    needs: [build-and-test, production]
    concurrency:
      group: deploy-production-standby
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app-name: machinespirit-app-uksouth
      base-url: https://machinespirit-app-uksouth.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true

  rollback-production-standby:
    name: roll back production standby
    needs: [build-and-test, production-standby]
    if: ${{ failure() && needs.production-standby.outputs.smoke == 'failure' }}
    concurrency:
      group: deploy-production-standby
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rollback.yml
    with:
      environment: production
      app-name: machinespirit-app-uksouth
      base-url: https://machinespirit-app-uksouth.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true

  # The MCP connector (#119): its own apps, deployed from the same package (its connector folder) the same way, staging
  # first, each checked by its own smoke tests (the Connector category). It doesn't wait for the site's deploys, nor
  # they for it: neither calls the other's code, only the public API.
  staging-connector:
    name: staging connector
    needs: build-and-test
    concurrency:
      group: deploy-staging-connector
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app-name: machinespirit-mcp-staging
      base-url: https://machinespirit-mcp-staging.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      package: connector
      smoke-tests: Category=Connector

  rollback-staging-connector:
    name: roll back staging connector
    needs: [build-and-test, staging-connector]
    if: ${{ failure() && needs.staging-connector.outputs.smoke == 'failure' }}
    concurrency:
      group: deploy-staging-connector
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rollback.yml
    with:
      environment: staging
      app-name: machinespirit-mcp-staging
      base-url: https://machinespirit-mcp-staging.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      package: connector
      smoke-tests: Category=Connector

  production-connector:
    name: production connector
    needs: [build-and-test, staging-connector]
    concurrency:
      group: deploy-production-connector
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app-name: machinespirit-mcp
      base-url: https://machinespirit-mcp.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      package: connector
      smoke-tests: Category=Connector

  rollback-production-connector:
    name: roll back production connector
    needs: [build-and-test, production-connector]
    if: ${{ failure() && needs.production-connector.outputs.smoke == 'failure' }}
    concurrency:
      group: deploy-production-connector
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rollback.yml
    with:
      environment: production
      app-name: machinespirit-mcp
      base-url: https://machinespirit-mcp.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      package: connector
      smoke-tests: Category=Connector

  production-connector-standby:
    name: production connector standby
    needs: [build-and-test, production-connector]
    concurrency:
      group: deploy-production-connector-standby
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app-name: machinespirit-mcp-uksouth
      base-url: https://machinespirit-mcp-uksouth.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      package: connector
      smoke-tests: Category=Connector

  rollback-production-connector-standby:
    name: roll back production connector standby
    needs: [build-and-test, production-connector-standby]
    if: ${{ failure() && needs.production-connector-standby.outputs.smoke == 'failure' }}
    concurrency:
      group: deploy-production-connector-standby
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rollback.yml
    with:
      environment: production
      app-name: machinespirit-mcp-uksouth
      base-url: https://machinespirit-mcp-uksouth.azurewebsites.net
      version: ${{ needs.build-and-test.outputs.version }}
      restricts-addresses: true
      package: connector
      smoke-tests: Category=Connector
