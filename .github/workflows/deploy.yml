name: Deploy

# One deployment of the Functions app, shared by Deploy Master and Deploy Branch to Staging. It signs in to Azure as
# the environment's GitHub identity (OIDC, no secrets), which may change that one app and nothing else (infra/).
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which holds the Azure identity's ids (staging or production).
        type: string
        required: true
      app-name:
        type: string
        required: true
      ref:
        description: The commit, branch or tag to deploy.
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # One deployment per environment at a time; a newer one waits rather than cancelling one half done.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Built in the git checkout, so /healthz reports the deployed commit (AppVersion).
      - name: Publish
        run: dotnet publish src/DailyMachineSpirit.Functions -c Release -o publish

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.app-name }}
          package: publish
          sku: flexconsumption

      # Inputs reach the shell as variables, never pasted into the script: a branch name can hold shell syntax.
      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          APP: ${{ inputs.app-name }}
        run: echo "Deployed \`$(git rev-parse --short HEAD)\` ($REF) to $APP." >> "$GITHUB_STEP_SUMMARY"
