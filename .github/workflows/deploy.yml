name: Deploy

# One deployment of the Functions app, shared by Deploy Master and Deploy Branch to Staging: the package Build and Test
# made in the same run, then smoke tests. It signs in to Azure as the environment's GitHub identity (OIDC, no secrets),
# which may change that one app and nothing else (infra/). When the smoke tests fail, the caller rolls back
# (rollback.yml), a job of its own beside this one, so the run's graph shows a rollback as where that run ends.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which holds the Azure identity's ids (staging or production).
        type: string
        required: true
      app-name:
        type: string
        required: true
      base-url:
        description: Where the smoke tests reach the app.
        type: string
        required: true
      version:
        description: The commit's first 7 characters, which /healthz must report once it's deployed.
        type: string
        required: true
      restricts-addresses:
        description: The app admits only some addresses (staging its owner, production Cloudflare), so the runner's is added for the smoke tests.
        type: boolean
        required: true
      test-voter-vault:
        description: Where the smoke tests read the secret that signs a test voter's cookie, to vote and take the vote back; empty for no voting (production, whose counts are public).
        type: string
        default: ''
      package:
        description: Which of the package's apps this is, its folder in the package (publish, the site; connector, the MCP connector).
        type: string
        default: publish
      smoke-tests:
        description: Which smoke tests check this app (a dotnet test filter); the connector's are its own category.
        type: string
        default: Category!=Connector
    outputs:
      smoke:
        description: The smoke tests' outcome (success, failure, or skipped when the run failed before them).
        value: ${{ jobs.deploy.outputs.smoke }}

permissions:
  contents: read
  id-token: write
  actions: read

env:
  RESOURCE_GROUP: machinespirit-rg
  APP: ${{ inputs.app-name }}
  BASE_URL: ${{ inputs.base-url }}
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Above the worst case, so the clean-up of the runner's rule always gets its turn: the deploy, the three-minute wait
    # for the access rule, and up to ten minutes of smoke tests (DeployedApp's waits and retries).
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    outputs:
      # Only a failure of the smoke tests themselves rolls back, not a run that never got to them.
      smoke: ${{ steps.smoke.outcome }}

    steps:
      # The shared steps for the runner's access rule.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Download the package
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name app --dir package

      # For the smoke tests, which are .NET tests published into the package. Before deploying, so a failure here changes
      # nothing.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The secret that signs the sign-in cookie, so the smoke tests can sign one for their test voter. The identity may
      # read this one secret (infra/), and the value is masked in the run's log. Before deploying, so a failed read
      # leaves the app as it was, instead of a deployment the smoke tests never checked and nothing rolls back.
      - name: Read the test voter's secret
        if: ${{ inputs.test-voter-vault != '' }}
        env:
          VAULT: ${{ inputs.test-voter-vault }}
        run: |
          secret=$(az keyvault secret show --vault-name "$VAULT" --name VoterSessionSecret --query value -o tsv)
          echo "::add-mask::$secret"
          echo "SMOKE_TEST_VOTER_SESSION_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.app-name }}
          package: package/${{ inputs.package }}
          sku: flexconsumption

      - name: Let the runner in
        if: ${{ inputs.restricts-addresses }}
        uses: ./.github/actions/let-runner-in
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app: ${{ inputs.app-name }}
          base-url: ${{ inputs.base-url }}

      - name: Smoke tests
        id: smoke
        env:
          SMOKE_TEST_BASE_URL: ${{ inputs.base-url }}
          SMOKE_TEST_VERSION: ${{ inputs.version }}
          FILTER: ${{ inputs.smoke-tests }}
        run: dotnet test package/smoke-tests/DailyMachineSpirit.SmokeTests.dll --filter "$FILTER" --logger "console;verbosity=normal"

      # Even when the run fails or is cancelled, and on a deployment that failed before letting its runner in: a rule left
      # by a runner that died goes too.
      - name: Shut the runner out
        if: ${{ always() && inputs.restricts-addresses }}
        uses: ./.github/actions/shut-runner-out
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app: ${{ inputs.app-name }}

      # Says what happened to the app, which isn't always what failed: a failed sign-in never reached it, and a failed
      # clean-up comes after tests that passed.
      - name: Summary
        if: ${{ always() }}
        env:
          OUTCOME: ${{ job.status }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            message="Deployed \`$VERSION\` to $APP; the smoke tests passed."
          elif [ "$DEPLOYED" != success ]; then
            message="\`$VERSION\` wasn't deployed to $APP: the run failed before or while deploying it."
          elif [ "$SMOKE" = success ]; then
            message="Deployed \`$VERSION\` to $APP and the smoke tests passed, but a later step failed: see the run."
          elif [ "$SMOKE" = failure ]; then
            message="\`$VERSION\` failed its smoke tests on $APP: the rollback puts the last good master back."
          else
            message="Deployed \`$VERSION\` to $APP, but the smoke tests couldn't run, so it isn't rolled back: see the run."
          fi
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
