name: Deploy

# One deployment of the Functions app, shared by Deploy Master and Deploy Branch to Staging: the package Build and Test
# made in the same run, then smoke tests, and the last good master's package back if they fail. It signs in to Azure as
# the environment's GitHub identity (OIDC, no secrets), which may change that one app and nothing else (infra/).
#
# Two jobs, so a run's graph shows a rollback as a step of its own: deploy (with the smoke tests), then rollback, which
# runs only when the smoke tests failed. One deployment per environment at a time is the caller's to ensure (its job's
# concurrency), so no other deployment comes between the two.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which holds the Azure identity's ids (staging or production).
        type: string
        required: true
      app-name:
        type: string
        required: true
      base-url:
        description: Where the smoke tests reach the app.
        type: string
        required: true
      version:
        description: The commit's first 7 characters, which /healthz must report once it's deployed.
        type: string
        required: true
      restricts-addresses:
        description: The app admits only some addresses (staging its owner, production Cloudflare), so the runner's is added for the smoke tests.
        type: boolean
        required: true

permissions:
  contents: read
  id-token: write
  actions: read

env:
  RESOURCE_GROUP: machinespirit-rg
  APP: ${{ inputs.app-name }}
  BASE_URL: ${{ inputs.base-url }}
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Above the worst case, so the clean-up of the runner's rule always gets its turn: the deploy, the three-minute wait
    # for the access rule, and up to ten minutes of smoke tests (DeployedApp's waits and retries).
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    outputs:
      # Only a failure of the smoke tests themselves rolls back, not a run that never got to them.
      smoke: ${{ steps.smoke.outcome }}

    steps:
      # The shared steps for the runner's access rule.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Download the package
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name app --dir package

      # For the smoke tests, which are .NET tests published into the package. Before deploying, so a failure here changes
      # nothing.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.app-name }}
          package: package/publish
          sku: flexconsumption

      - name: Let the runner in
        if: ${{ inputs.restricts-addresses }}
        uses: ./.github/actions/let-runner-in
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app: ${{ inputs.app-name }}
          base-url: ${{ inputs.base-url }}

      - name: Smoke tests
        id: smoke
        env:
          SMOKE_TEST_BASE_URL: ${{ inputs.base-url }}
          SMOKE_TEST_VERSION: ${{ inputs.version }}
        run: dotnet test package/smoke-tests/DailyMachineSpirit.SmokeTests.dll --logger "console;verbosity=normal"

      # Even when the run fails or is cancelled, and on a deployment that failed before letting its runner in: a rule left
      # by a runner that died goes too.
      - name: Shut the runner out
        if: ${{ always() && inputs.restricts-addresses }}
        uses: ./.github/actions/shut-runner-out
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app: ${{ inputs.app-name }}

      # Says what happened to the app, which isn't always what failed: a failed sign-in never reached it, and a failed
      # clean-up comes after tests that passed.
      - name: Summary
        if: ${{ always() }}
        env:
          OUTCOME: ${{ job.status }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            message="Deployed \`$VERSION\` to $APP; the smoke tests passed."
          elif [ "$DEPLOYED" != success ]; then
            message="\`$VERSION\` wasn't deployed to $APP: the run failed before or while deploying it."
          elif [ "$SMOKE" = success ]; then
            message="Deployed \`$VERSION\` to $APP and the smoke tests passed, but a later step failed: see the run."
          elif [ "$SMOKE" = failure ]; then
            message="\`$VERSION\` failed its smoke tests on $APP: the rollback job puts the last good master back."
          else
            message="Deployed \`$VERSION\` to $APP, but the smoke tests couldn't run, so it isn't rolled back: see the run."
          fi
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  # The newest master that passed its own smoke tests (Deploy Master succeeds only then), whose package is kept 90 days.
  # It succeeds when that package is back and passes its own smoke tests; the run still fails, by the deploy job.
  rollback:
    name: rollback
    needs: deploy
    if: ${{ failure() && needs.deploy.outputs.smoke == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Find the last good package
        id: last-good
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-master.yml --branch master --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error title=Rollback::No successful Deploy Master run with a package to roll back to."
            exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name app --dir last-good
          echo "version=$(cat last-good/version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll back
        id: rollback
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.app-name }}
          package: last-good/publish
          sku: flexconsumption

      # This job's runner has an address of its own.
      - name: Let the runner in
        if: ${{ inputs.restricts-addresses }}
        uses: ./.github/actions/let-runner-in
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app: ${{ inputs.app-name }}
          base-url: ${{ inputs.base-url }}

      # The last good package's own smoke tests, which match what it serves.
      - name: Smoke tests
        id: smoke
        env:
          LAST_GOOD: ${{ steps.last-good.outputs.version }}
          SMOKE_TEST_BASE_URL: ${{ inputs.base-url }}
          SMOKE_TEST_VERSION: ${{ steps.last-good.outputs.version }}
        run: |
          dotnet test last-good/smoke-tests/DailyMachineSpirit.SmokeTests.dll --logger "console;verbosity=normal"
          echo "::error title=Rolled back::$VERSION failed its smoke tests, so $APP runs $LAST_GOOD again."

      - name: Shut the runner out
        if: ${{ always() && inputs.restricts-addresses }}
        uses: ./.github/actions/shut-runner-out
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app: ${{ inputs.app-name }}

      - name: Summary
        if: ${{ always() }}
        env:
          LAST_GOOD: ${{ steps.last-good.outputs.version }}
          REDEPLOYED: ${{ steps.rollback.outcome }}
          CHECKED: ${{ steps.smoke.outcome }}
        run: |
          if [ "$CHECKED" = success ]; then
            message="$APP was rolled back to \`$LAST_GOOD\`, which passed its smoke tests."
          elif [ -z "$LAST_GOOD" ]; then
            message="$APP wasn't rolled back: there was no last good package to put back. Check the app."
          elif [ "$REDEPLOYED" != success ]; then
            message="Deploying \`$LAST_GOOD\` back to $APP failed: check the app."
          else
            message="$APP runs \`$LAST_GOOD\` again, but it failed its smoke tests too: check the app."
          fi
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
